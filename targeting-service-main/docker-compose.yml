services:
  app:
    build: .
    container_name: targeting_app
    ports:
      - "8003:8003"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://utilizador:palavra_passe@db:5432/targeting_db
      - AUTH_SERVICE_URL=http://host.docker.internal:8001

  db:
    image: postgres:15-alpine
    container_name: targeting_db
    environment:
      - POSTGRES_USER=utilizador
      - POSTGRES_PASSWORD=palavra_passe
      - POSTGRES_DB=targeting_db
    ports:
      - "5432:5432"
    volumes:
      # O Docker executa automaticamente qualquer script SQL dentro desta pasta ao criar a BD
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql